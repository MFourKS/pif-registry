name: CI

on:
  push:
  pull_request:
  # Коммит от встроенного токена не запускает push, поэтому обновление данных вызывает CI явно.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Установка
        run: pip install -e ".[dev]"
      - name: Линтер
        run: ruff check src tests
      - name: Типы
        run: mypy src
      - name: Тесты
        run: pytest
      - name: Сборка сайта из данных репозитория
        run: python -m pif build
      - name: Ворота публикации
        run: python -m pif gate
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Демо обновляется из данных в репозитории, сбор с сайтов УК здесь не запускается.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}pif/
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
