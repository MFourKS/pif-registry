name: Обновление данных

on:
  schedule:
    # Каждый рабочий день в 09:30 МСК: УК публикуют СЧА за прошлый день к утру.
    - cron: "30 6 * * 1-5"
  workflow_dispatch:
    inputs:
      runner:
        description: "Где запускать (сайты части УК закрыты для зарубежных адресов)"
        default: ubuntu-latest

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .

      # Сырые файлы и состояние кэша не лежат в git, поэтому переносятся между запусками кэшем.
      - uses: actions/cache@v4
        with:
          path: |
            raw
            state
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Сбор, расчёты, отчёт качества и сборка сайта
        run: python -m pif run --no-gate

      - name: Ворота публикации
        run: python -m pif gate

      - name: Сохранить данные в репозитории
        run: |
          git config user.name "pif-registry"
          git config user.email "pif-registry@users.noreply.github.com"
          git add data manifest
          git diff --cached --quiet || git commit -m "Данные на $(date +%F)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}pif/
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
