name: Обновление данных

on:
  schedule:
    # Каждый рабочий день в 09:30 МСК: УК публикуют СЧА за прошлый день к утру.
    - cron: "30 6 * * 1-5"
  workflow_dispatch:
    inputs:
      runner:
        description: "Где запускать (сайты части УК могут отвечать только российским адресам)"
        default: ubuntu-latest

permissions:
  contents: write
  actions: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    # Сайты ВИМ, ААА и АК БАРС отвечают адресам GitHub ошибкой 403, поэтому расписанию нужен раннер в России.
    # Пока переменная UPDATE_RUNNER не задана, запуск по расписанию пропускается, вручную запустить можно.
    if: github.event_name == 'workflow_dispatch' || vars.UPDATE_RUNNER != ''
    runs-on: ${{ inputs.runner || vars.UPDATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .

      # Сырые файлы и состояние кэша не лежат в git, поэтому переносятся между запусками кэшем.
      - uses: actions/cache@v4
        with:
          path: |
            raw
            state
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Сбор, расчёты и отчёт качества
        run: python -m pif run --no-gate

      # Публикуются только данные без ошибок разбора и без массового сбоя сбора.
      - name: Ворота публикации
        run: python -m pif gate

      - name: Сохранить данные в репозитории
        run: |
          git config user.name "pif-registry"
          git config user.email "pif-registry@users.noreply.github.com"
          git add data manifest
          git diff --cached --quiet || git commit -m "Данные на $(date +%F)"
          git push

      - name: Выложить демо
        run: gh workflow run ci.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
